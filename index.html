<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ocean Pollution — Before &amp; After</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050f22; }
  #scene { position: absolute; inset: 0; }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.68) 100%);
  }
  #rotateBtn {
    position: absolute; bottom: max(28px, env(safe-area-inset-bottom, 28px));
    left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(0,0,0,0.38); backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 12px 36px; border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.78); cursor: pointer;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 11px; font-weight: 500; letter-spacing: 3.5px; text-transform: uppercase;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
    white-space: nowrap; -webkit-tap-highlight-color: transparent;
    min-width: 44px; min-height: 44px;
  }
  #rotateBtn:hover, #rotateBtn:focus-visible {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.32);
    color: #fff; outline: none;
  }
  #rotateBtn:active { transform: translateX(-50%) scale(0.97); }
</style>
</head>
<body>
<div id="scene"></div>
<div class="vignette"></div>
<button id="rotateBtn" aria-label="Toggle auto-rotation">AUTO-ROTATE</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── DEVICE CAPABILITY DETECTION ──────────────────────────────────────────────
const isMobile  = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
const isLowEnd  = isMobile && (navigator.hardwareConcurrency || 4) <= 4;

// Quality tiers
const Q = {
  waterSegsClean:   isMobile ? [40, 30] : [90, 70],
  waterSegsPoluted: isMobile ? [22, 18] : [50, 38],
  sandSegs:         isMobile ? [10,  6] : [22, 14],
  shadowMapSize:    isMobile ? 1024 : 2048,
  bloomEnabled:     !isLowEnd,
  pixelRatio:       Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2),
};

// ─── RENDERER ─────────────────────────────────────────────────────────────────
const container = document.getElementById('scene');
const renderer  = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Q.pixelRatio);
renderer.shadowMap.enabled  = true;
renderer.shadowMap.type     = isMobile ? THREE.BasicShadowMap : THREE.PCFSoftShadowMap;
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

// ─── SCENE ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog   = new THREE.FogExp2(0x9ac4d8, 0.007);

// ─── SKY BACKGROUND ───────────────────────────────────────────────────────────
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 4; skyCanvas.height = 512;
const skyCtx    = skyCanvas.getContext('2d');
const skyGrad   = skyCtx.createLinearGradient(0, 0, 0, 512);
skyGrad.addColorStop(0.00, '#050f22');
skyGrad.addColorStop(0.28, '#0d3468');
skyGrad.addColorStop(0.55, '#1a72b8');
skyGrad.addColorStop(0.78, '#5ab4d8');
skyGrad.addColorStop(0.90, '#f0c870');
skyGrad.addColorStop(1.00, '#d06828');
skyCtx.fillStyle = skyGrad;
skyCtx.fillRect(0, 0, 4, 512);
scene.background = new THREE.CanvasTexture(skyCanvas);

// ─── CAMERA ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 600);
camera.position.set(0, 22, 52);

// ─── CONTROLS ─────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping    = true;
controls.dampingFactor    = 0.055;
controls.minDistance      = 20;
controls.maxDistance      = 95;
controls.maxPolarAngle    = Math.PI / 2.1;
controls.target.set(0, 1.5, 0);
controls.touches          = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// ─── POST-PROCESSING ──────────────────────────────────────────────────────────
let composer;
if (Q.bloomEnabled) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.38, 0.84
  ));
}
function render() {
  composer ? composer.render() : renderer.render(scene, camera);
}

// ─── LIGHTING ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x99bbdd, 0.28));
scene.add(new THREE.HemisphereLight(0xffeedd, 0x1a3355, 0.55));

const sun = new THREE.DirectionalLight(0xfff3cc, 2.4);
sun.position.set(30, 32, 16);
sun.castShadow                   = true;
sun.shadow.mapSize.set(Q.shadowMapSize, Q.shadowMapSize);
sun.shadow.camera.left           = -55;
sun.shadow.camera.right          =  55;
sun.shadow.camera.top            =  55;
sun.shadow.camera.bottom         = -55;
sun.shadow.camera.far            = 140;
sun.shadow.bias                  = -0.0004;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x5577aa, 0.38);
fillLight.position.set(-32, 20, 6);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xff9944, 0.6);
rimLight.position.set(0, 14, -35);
scene.add(rimLight);

// ─── WATER SHADERS ────────────────────────────────────────────────────────────
const cleanWaterVert = /* glsl */`
  uniform float time;
  varying vec2 vUv;
  varying float vWave;
  void main() {
    vUv = uv;
    vec3 p = position;
    p.y += sin(p.x * 0.22 + time * 1.9)  * 0.24
         + sin(p.z * 0.32 + time * 1.35) * 0.19
         + sin(p.x * 0.11 + p.z * 0.17 + time * 0.88) * 0.30
         + sin(p.x * 0.48 - p.z * 0.26 + time * 2.5)  * 0.09;
    vWave = p.y - position.y;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }
`;
const cleanWaterFrag = /* glsl */`
  uniform float time;
  varying vec2 vUv;
  varying float vWave;
  void main() {
    float d   = 1.0 - vUv.y;
    vec3 col  = mix(vec3(0.10, 0.76, 0.72), vec3(0.04, 0.42, 0.72), smoothstep(0.0, 0.4, d));
    col       = mix(col, vec3(0.02, 0.18, 0.52), smoothstep(0.4, 1.0, d));
    float c   = sin(vUv.x * 55.0 + time * 2.4) * sin(vUv.y * 42.0 - time * 1.9);
    col      += max(0.0, c) * 0.09 * (1.0 - d * 0.7);
    col       = mix(col, vec3(0.94, 0.98, 1.0), smoothstep(0.10, 0.42, vWave) * 0.55);
    col       = mix(col, vec3(0.55, 0.92, 0.88), (1.0 - d) * 0.28);
    gl_FragColor = vec4(col, mix(0.80, 0.96, d));
  }
`;
const pollutedWaterVert = /* glsl */`
  uniform float time;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vec3 p  = position;
    p.y    += sin(p.x * 0.18 + time * 0.75) * 0.10
            + sin(p.z * 0.22 + time * 0.55) * 0.08;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }
`;
const pollutedWaterFrag = /* glsl */`
  uniform float time;
  varying vec2 vUv;
  void main() {
    float d  = 1.0 - vUv.y;
    vec3 col = mix(vec3(0.10, 0.15, 0.08), vec3(0.04, 0.07, 0.04), d * d);
    float oil = (sin(vUv.x * 28.0 + time * 0.45) * 0.5 + 0.5)
              * (sin(vUv.y * 18.0 - time * 0.28) * 0.5 + 0.5);
    col = mix(col, mix(vec3(0.28, 0.0, 0.30), vec3(0.0, 0.22, 0.12), sin(oil*6.28)*0.5+0.5), oil * 0.38);
    gl_FragColor = vec4(col, 0.95);
  }
`;

function buildWater(vert, frag, w, d, sW, sD, cx) {
  const geo = new THREE.PlaneGeometry(w, d, sW, sD);
  geo.rotateX(-Math.PI / 2);
  const uni = { time: { value: 0.0 } };
  const mat = new THREE.ShaderMaterial({ uniforms: uni, vertexShader: vert, fragmentShader: frag, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(cx, 0.04, -8);
  mesh.renderOrder = 1;
  scene.add(mesh);
  return uni;
}
const CWU = buildWater(cleanWaterVert,    cleanWaterFrag,    40, 26, ...Q.waterSegsClean,   20);
const PWU = buildWater(pollutedWaterVert, pollutedWaterFrag, 40, 26, ...Q.waterSegsPoluted, -20);

// ─── SAND ─────────────────────────────────────────────────────────────────────
function buildSand(color, cx) {
  const geo = new THREE.PlaneGeometry(40, 24, ...Q.sandSegs);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, pos.getY(i) + (Math.random() - 0.5) * 0.09);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.94 }));
  mesh.position.set(cx, 0, 11);
  mesh.receiveShadow = true;
  scene.add(mesh);
}
buildSand(0xF0CF8A,  20);
buildSand(0x7A6245, -20);

// ─── DIVIDER ──────────────────────────────────────────────────────────────────
const divMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.55, 0.9, 50),
  new THREE.MeshStandardMaterial({ color: 0xf0e8d0, roughness: 0.55, emissive: 0xf5e6c8, emissiveIntensity: 0.12 })
);
divMesh.position.set(0, 0.18, 1);
divMesh.castShadow = true;
scene.add(divMesh);
scene.add(Object.assign(new THREE.Mesh(
  new THREE.BoxGeometry(0.18, 1.0, 50),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.10 })
), { position: divMesh.position.clone() }));

// ─── MATERIALS ────────────────────────────────────────────────────────────────
const mTrunk  = new THREE.MeshStandardMaterial({ color: 0x4A2E18, roughness: 0.92 });
const mLeaf   = new THREE.MeshStandardMaterial({ color: 0x1C7820, roughness: 0.62 });
const mLeafLt = new THREE.MeshStandardMaterial({ color: 0x38B040, roughness: 0.55 });
const mRock   = new THREE.MeshStandardMaterial({ color: 0x797068, roughness: 0.96 });
const mShell  = new THREE.MeshStandardMaterial({ color: 0xFFE5D0, roughness: 0.48, metalness: 0.06 });
const mStar   = new THREE.MeshStandardMaterial({ color: 0xFF6228, roughness: 0.55, emissive: 0x3e1400, emissiveIntensity: 0.3 });
const mFishO  = new THREE.MeshStandardMaterial({ color: 0xFF8520, roughness: 0.30, metalness: 0.18, emissive: 0x3a1000, emissiveIntensity: 0.14 });
const mFishB  = new THREE.MeshStandardMaterial({ color: 0x2090E0, roughness: 0.30, metalness: 0.18, emissive: 0x001428, emissiveIntensity: 0.14 });
const mFishT  = new THREE.MeshStandardMaterial({ color: 0x18C09A, roughness: 0.30, metalness: 0.22, emissive: 0x003828, emissiveIntensity: 0.12 });
const mFishD  = new THREE.MeshStandardMaterial({ color: 0x706858, roughness: 0.86 });
const mTShell = new THREE.MeshStandardMaterial({ color: 0x3A5018, roughness: 0.72 });
const mTBody  = new THREE.MeshStandardMaterial({ color: 0x4A6230, roughness: 0.62 });
const mTSick  = new THREE.MeshStandardMaterial({ color: 0x454840, roughness: 0.88 });
const mTSickB = new THREE.MeshStandardMaterial({ color: 0x3A3E30, roughness: 0.88 });
const mPlasR  = new THREE.MeshStandardMaterial({ color: 0xB81212, roughness: 0.35 });
const mPlasB  = new THREE.MeshStandardMaterial({ color: 0x1854B8, roughness: 0.35 });
const mPlasW  = new THREE.MeshPhysicalMaterial({ color: 0xeeeeee, roughness: 0.28, transmission: 0.32, transparent: true, opacity: 0.84 });
const mCan    = new THREE.MeshStandardMaterial({ color: 0xc0c0c8, roughness: 0.24, metalness: 0.86 });
const mOil    = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.04, metalness: 0.88, emissive: 0x100800, emissiveIntensity: 0.08 });
const mBird   = new THREE.MeshStandardMaterial({ color: 0xeeeef0, roughness: 0.48 });
const mSmoke  = new THREE.MeshStandardMaterial({ color: 0x505050, roughness: 1.0,  transparent: true, opacity: 0.38 });

// ─── BUILDERS ─────────────────────────────────────────────────────────────────
function palmTree(x, z, h, lean) {
  const g = new THREE.Group();
  for (let s = 0; s < 8; s++) {
    const r   = 0.30 - s * 0.022;
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.88, r, h / 8, 10), mTrunk);
    seg.position.set(Math.sin(s / 8 * 0.65) * lean, (s + 0.5) * (h / 8), 0);
    seg.castShadow = true;
    g.add(seg);
  }
  const tx = Math.sin(0.65) * lean;
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + Math.random() * 0.06;
    const L = 4.2 + Math.random() * 0.6;
    for (let s = 0; s < 4; s++) {
      const t = s / 4, drp = Math.pow(t, 1.9) * 1.4;
      const lf = new THREE.Mesh(new THREE.ConeGeometry(0.24 * (1 - t * 0.52), L / 4, 5), s < 2 ? mLeaf : mLeafLt);
      lf.position.set(tx + Math.cos(a) * (t * L * 0.72 + L / 8), h + 0.4 - drp, Math.sin(a) * (t * L * 0.72 + L / 8));
      lf.rotation.set(Math.cos(a) * 1.05 - drp * 0.45, -a, Math.sin(a) * 1.05);
      lf.castShadow = true;
      g.add(lf);
    }
  }
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.30, 12, 8), mTrunk);
    c.position.set(tx + Math.cos(a) * 0.32, h - 0.55, Math.sin(a) * 0.32);
    g.add(c);
  }
  g.position.set(x, 0, z);
  return g;
}

function fish(mat, scale) {
  const g    = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.36, 14, 10), mat);
  body.scale.set(1.72, 0.76, 0.62);
  g.add(body);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.48, 10), mat);
  tail.position.set(-0.65, 0, 0);
  tail.rotation.z = Math.PI / 2;
  g.add(tail);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.056, 8, 6), new THREE.MeshBasicMaterial({ color: 0x080808 }));
  eye.position.set(0.35, 0.10, 0.20);
  g.add(eye);
  g.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.22, 5), mat), { position: new THREE.Vector3(0, 0.26, 0) }));
  g.scale.setScalar(scale);
  g.castShadow = true;
  return g;
}

function turtle(sMat, bMat) {
  const g     = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1.12, 24, 16), sMat);
  shell.scale.set(1, 0.48, 1.32);
  shell.castShadow = true;
  g.add(shell);
  for (let i = 0; i < 7; i++) {
    const a  = (i / 7) * Math.PI * 2;
    const sc = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 6),
      new THREE.MeshStandardMaterial({ color: sMat.color.clone().offsetHSL(0, 0, 0.07), roughness: 0.72 }));
    sc.position.set(Math.cos(a) * 0.54, 0.47, Math.sin(a) * 0.66);
    sc.scale.y = 0.3;
    g.add(sc);
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 12), bMat);
  head.position.set(0, 0.06, 1.38);
  g.add(head);
  [[-0.16, 0.20, 1.60], [0.16, 0.20, 1.60]].forEach(([x, y, z]) => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.058, 8, 6), new THREE.MeshBasicMaterial({ color: 0x050505 }));
    e.position.set(x, y, z);
    g.add(e);
  });
  [[-0.92, 0, 0.52], [0.92, 0, 0.52], [-0.80, 0, -0.82], [0.80, 0, -0.82]].forEach(([x, y, z]) => {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.30, 12, 10), bMat);
    f.position.set(x, y, z);
    f.scale.set(1.85, 0.38, 1.0);
    f.castShadow = true;
    g.add(f);
  });
  return g;
}

function starfish(x, z, scale) {
  const g   = new THREE.Group();
  const ctr = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), mStar);
  ctr.scale.y = 0.34;
  g.add(ctr);
  for (let i = 0; i < 5; i++) {
    const a   = (i / 5) * Math.PI * 2;
    const arm = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.68, 8), mStar);
    arm.position.set(Math.cos(a) * 0.40, 0, Math.sin(a) * 0.40);
    arm.rotation.set(0, -a, -Math.PI / 2);
    arm.scale.y = 0.44;
    g.add(arm);
  }
  g.position.set(x, 0.22, z);
  g.scale.setScalar(scale);
  return g;
}

// ─── CLEAN SIDE ───────────────────────────────────────────────────────────────
[
  [ 4, 16,  9.5,  0.40], [10, 15, 10.5, -0.28], [17, 17,  9.8,  0.18],
  [24, 15.5, 10, -0.32], [31, 16.5, 9.2,  0.38], [ 7, 18.5, 8.8, -0.20],
  [20, 18,  11.0,  0.25], [28, 17,   9.0, -0.15],
].forEach(([x, z, h, l]) => scene.add(palmTree(x, z, h, l)));

for (let i = 0; i < 12; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45 + Math.random() * 0.55, 0), mRock);
  r.position.set(2 + Math.random() * 36, 0.38, 18 + Math.random() * 4 - (i % 3 === 0 ? 8 : 0));
  r.rotation.set(Math.random(), Math.random(), Math.random());
  r.scale.y = 0.55; r.castShadow = true; r.receiveShadow = true;
  scene.add(r);
}
for (let i = 0; i < 10; i++) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12, 0, Math.PI), mShell);
  s.position.set(3 + Math.random() * 35, 0.24, 4 + Math.random() * 14);
  s.rotation.set(-Math.PI / 2, 0, Math.random() * Math.PI);
  s.scale.set(1, 1, 0.55); s.castShadow = true;
  scene.add(s);
}
scene.add(starfish(16, 3, 1.7));
scene.add(starfish(24, 6, 1.4));
scene.add(starfish(32, 2, 1.9));

const happyTurtle = turtle(mTShell, mTBody);
happyTurtle.position.set(9, 0.62, -2);
happyTurtle.rotation.y = -0.45;
scene.add(happyTurtle);

// Fish school
const fishGroup  = new THREE.Group();
const fishMeshes = [];
[[mFishO,1.1],[mFishB,0.92],[mFishO,1.0],[mFishB,1.18],[mFishT,0.87],[mFishO,0.96],
 [mFishB,1.06],[mFishT,1.12],[mFishO,0.90],[mFishB,0.82],[mFishT,1.02],[mFishO,1.14]
].forEach(([mat, s], i) => {
  const f = fish(mat, s);
  const a = (i / 12) * Math.PI * 2;
  const r = 2.8 + (i % 4) * 1.2;
  f.position.set(Math.cos(a) * r, 0.36 + Math.random() * 0.28, Math.sin(a) * r - 6);
  f.userData = { baseA: a, radius: r, baseY: f.position.y, speed: 0.22 + Math.random() * 0.09 };
  fishGroup.add(f);
  fishMeshes.push(f);
});
fishGroup.position.set(20, 0, 0);
scene.add(fishGroup);

// Seagulls
const birds = [];
function seagull() {
  const g  = new THREE.Group();
  const bd = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), mBird);
  bd.scale.set(1.6, 0.55, 0.5);
  g.add(bd);
  const wm = new THREE.MeshStandardMaterial({ color: 0xf8f8fa, side: THREE.DoubleSide, roughness: 0.38 });
  const wL = new THREE.Mesh(new THREE.PlaneGeometry(0.70, 0.20), wm);
  wL.position.set(0, 0, 0.30); wL.rotation.x = -Math.PI / 2; g.add(wL);
  const wR = wL.clone(); wR.position.z = -0.30; g.add(wR);
  g.userData = { wL, wR, offset: Math.random() * Math.PI * 2 };
  return g;
}
[[10,12, 2],[18,14,-3],[26,13, 1],[14,15, 4]].forEach(([x, y, z]) => {
  const b = seagull();
  b.position.set(x, y, z);
  b.userData.baseY    = y;
  b.userData.orbitA   = Math.random() * Math.PI * 2;
  b.userData.orbitR   = 7 + Math.random() * 5;
  b.userData.orbitSpd = 0.13 + Math.random() * 0.09;
  birds.push(b);
  scene.add(b);
});

// Sun
const sunCore = new THREE.Mesh(new THREE.SphereGeometry(1.5, 24, 18), new THREE.MeshBasicMaterial({ color: 0xfffce8 }));
const sunGl1  = new THREE.Mesh(new THREE.SphereGeometry(2.4, 24, 18), new THREE.MeshBasicMaterial({ color: 0xffd060, transparent: true, opacity: 0.34 }));
const sunGl2  = new THREE.Mesh(new THREE.SphereGeometry(3.6, 24, 18), new THREE.MeshBasicMaterial({ color: 0xff9020, transparent: true, opacity: 0.11 }));
[sunCore, sunGl1, sunGl2].forEach(m => { m.position.set(28, 18, -20); scene.add(m); });

// Bubbles
const bubbles = [];
for (let i = 0; i < 24; i++) {

// White clouds
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.92 });
const clouds   = [];
function makeCloud(x, y, z) {
  const g = new THREE.Group();
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.9 + Math.random() * 0.5, 12, 8), cloudMat);
    c.position.set(i * 0.85 - 2.1, Math.sin(i * 0.9) * 0.22, 0);
    g.add(c);
  }
  g.position.set(x, y, z); g.userData.baseX = x;
  clouds.push(g); scene.add(g);
}
makeCloud( 8, 12, -12); makeCloud(20, 14,  -8);
makeCloud(30, 13, -16); makeCloud(15, 15,   0);

// ─── POLLUTED SIDE ────────────────────────────────────────────────────────────
for (let i = 0; i < 22; i++) {

  scene.add(oil);
}

const plasticMats = [mPlasB, mPlasW, mPlasR, mPlasB, mPlasW, mPlasR];
function bottle(x, z, mat) {
  const g    = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 1.15, 16), mat);
  body.castShadow = true;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.30, 0.24, 14), mat);
  neck.position.y = 0.69;
  const cap  = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.20, 14), mPlasR);
  cap.position.y = 0.88;
  g.add(body, neck, cap);
  g.position.set(x, 0.26, z);
  g.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI * 2);
  return g;
}
[[-5,8],[-11,4],[-18,9],[-6,-4],[-23,-6],[-9,-9],[-28,5],[-15,-13],[-33,3],[-7,13],[-25,11],[-19,-7],[-31,-11],[-13,6],[-36,-3]]
  .forEach(([x, z], i) => scene.add(bottle(x, z, plasticMats[i % 6])));

// ─── ANIMATION ────────────────────────────────────────────────────────────────
let autoRotate = true;
const btn = document.getElementById('rotateBtn');
btn.addEventListener('click', () => {
  autoRotate       = !autoRotate;
  btn.textContent  = autoRotate ? 'AUTO-ROTATE' : 'PAUSED';
});
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.32;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  controls.autoRotate = autoRotate;
  controls.update();

  CWU.time.value = t;
  PWU.time.value = t;

  // Fish school orbit
  fishMeshes.forEach((f, i) => {
    const a       = f.userData.baseA + t * f.userData.speed;
    const r       = f.userData.radius;
    f.position.x  = Math.cos(a) * r;
    f.position.z  = Math.sin(a) * r - 6;
    f.position.y  = f.userData.baseY + Math.sin(t * 2.6 + i) * 0.09;
    f.rotation.y  = -a + Math.PI / 2;
    f.children[1].rotation.y = Math.sin(t * 12 + i * 0.8) * 0.06;
  });

  happyTurtle.position.y = 0.62 + Math.sin(t * 1.08) * 0.09;
  happyTurtle.rotation.z = Math.sin(t * 0.72) * 0.07;
  sickTurtle.rotation.z  = Math.sin(t * 0.32) * 0.026;

  birds.forEach((b, i) => {
    b.userData.orbitA += b.userData.orbitSpd * 0.016;
    const a          = b.userData.orbitA;
    b.position.x     = 15 + Math.cos(a) * b.userData.orbitR;
    b.position.z     = Math.sin(a) * b.userData.orbitR;
    b.position.y     = b.userData.baseY + Math.sin(t * 1.4 + i) * 0.32;
    b.rotation.y     = a + Math.PI / 2;
    b.userData.wL.rotation.y =  Math.sin(t * 9.5 + b.userData.offset) * 0.72;
    b.userData.wR.rotation.y = -Math.sin(t * 9.5 + b.userData.offset) * 0.72;
  });

  clouds.forEach((c, i)     => { c.position.x = c.userData.baseX + Math.sin(t * 0.07 + i)       * 1.0; });
  darkClouds.forEach((c, i) => { c.position.x = c.userData.baseX + Math.sin(t * 0.04 + i * 1.5) * 0.6; });

  smokeParticles.forEach(s => {
    s.position.x = s.userData.baseX + Math.sin(t * 0.22 + s.userData.off) * 0.6;
    s.position.y += 0.0025;
    if (s.position.y > 15) s.position.y = 5;
  });

  trashParticles.forEach(p => {
    p.position.x += p.userData.dx;
    p.position.z += p.userData.dz;
    p.rotation.y += 0.005;
    if (p.position.x > -1.5 || p.position.x < -38) p.userData.dx *= -1;
    if (p.position.z >  0   || p.position.z < -24) p.userData.dz *= -1;
  });

  bubbles.forEach(b => {
    b.position.y += b.userData.spd;
    b.position.x += Math.sin(t * 2.1 + b.userData.off) * 0.0028;
    if (b.position.y > 2.0) b.position.y = 0.12;
  });

  sunGl1.scale.setScalar(1 + Math.sin(t * 1.9) * 0.055);
  sunGl2.scale.setScalar(1 + Math.sin(t * 1.3) * 0.10);

  render();
}
animate();

// ─── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
}, { passive: true });
